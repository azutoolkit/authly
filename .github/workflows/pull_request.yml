name: Crystal CI Pull Request

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: crystallang/crystal:1.22.1

    steps:
      - uses: actions/checkout@v1

      - name: Install dependencies
        run: shards install

      - name: Run Code Format
        run: crystal tool format --check

      # Built from the shard: the repository used to carry a macOS binary that cannot run here.
      - name: Run Ameba Checks
        run: crystal run lib/ameba/bin/ameba.cr

      - name: Run Authorization Service
        run: crystal ./spec/support/test_server.cr &

      # Everything under spec/, handlers included (spec/support has only helpers and one handler spec, all spec-safe)
      - name: Run Specs
        run: crystal spec
