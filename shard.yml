name: authly
version: 1.3.6
authors:
  - Elias Perez <elias.perez@nytimes.com>
crystal: '>=1.22.0'
license: MIT
targets:
  authly:
    main: src/authly.cr
dependencies:
  jwt:
    github: crystal-community/jwt
  # Loaded only by `require "authly/redis"`: an app that does not require it compiles none of it.
  redis:
    github: stefanwille/crystal-redis
    version: ~> 2.9.0
development_dependencies:
  faker:
    github: askn/faker
  ameba:
    github: crystal-ameba/ameba
